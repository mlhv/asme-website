[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asmesite"
version = "0.1.0"
description = "Static-site builder for the Drexel ASME club website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "jinja2",
    "pillow",
    "pillow-heif",
]

[project.optional-dependencies]
dev = ["pytest", "beautifulsoup4"]

[tool.setuptools]
packages = ["asmesite"]

[tool.setuptools.package-data]
asmesite = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
